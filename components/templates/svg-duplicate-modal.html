<div class="modal-overlay hidden" id="duplicateModal">
  <div class="modal-overlay-bg"></div>
  <div class="modal dup-modal">
    <div class="modal-header">
      <h3>
        <svg class="dup-warn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Duplicate Icons Found
      </h3>
      <button class="modal-close" id="dupCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <p class="dup-message">Some icons share the same name or look visually identical. Select which ones to keep in the sprite, or keep all (duplicates will be auto-renamed).</p>
      <div class="dup-groups" id="dupGroups"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="dupCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="dupKeepAllBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Keep All &amp; Rename
      </button>
      <button class="btn btn-primary" id="dupConfirmBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Keep Selected
      </button>
    </div>
  </div>
</div>
