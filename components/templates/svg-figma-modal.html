<div class="modal-overlay hidden" id="figmaModal">
  <div class="modal-overlay-bg"></div>
  <div class="modal figma-modal">
    <div class="modal-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 5.5A3.5 3.5 0 0 1 8.5 2H12v7H8.5A3.5 3.5 0 0 1 5 5.5z"/>
          <path d="M12 2h3.5a3.5 3.5 0 1 1 0 7H12V2z"/>
          <path d="M12 12.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 1 1-7 0z"/>
          <path d="M5 19.5A3.5 3.5 0 0 1 8.5 16H12v3.5a3.5 3.5 0 1 1-7 0z"/>
          <path d="M5 12.5A3.5 3.5 0 0 1 8.5 9H12v7H8.5A3.5 3.5 0 0 1 5 12.5z"/>
        </svg>
        Figma Import
      </h3>
      <button class="modal-close" id="figmaCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <!-- Connection -->
      <div class="figma-connect">
        <div class="figma-connect-row">
          <div class="form-group">
            <label for="figmaToken">Personal Access Token</label>
            <input type="password" id="figmaToken" placeholder="figd_xxxxx…" autocomplete="off" spellcheck="false">
          </div>
        </div>
        <a class="figma-token-help" href="https://help.figma.com/hc/en-us/articles/8085703771159-Manage-personal-access-tokens" target="_blank" rel="noopener">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          How to get a token (requires <strong>file_content:read</strong> scope)
        </a>
        <div class="figma-connect-row">
          <div class="form-group">
            <label for="figmaUrl">Figma File URL</label>
            <input type="text" id="figmaUrl" placeholder="https://www.figma.com/design/abc123/MyIcons" autocomplete="off" spellcheck="false">
          </div>
          <button class="figma-load-btn" id="figmaLoadBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
            </svg>
            Load
          </button>
        </div>
      </div>

      <!-- File info -->
      <div class="figma-file-info" id="figmaFileInfo" style="display:none">
        <span>File: <strong id="figmaFileName">—</strong></span>
        <span>·</span>
        <span><span id="figmaCompCount">0</span> components</span>
      </div>

      <!-- Search & select -->
      <div class="figma-search-bar">
        <input type="text" id="figmaSearch" placeholder="Search components…">
        <div class="figma-select-actions">
          <button id="figmaSelAll">All</button>
          <button id="figmaSelNone">None</button>
        </div>
      </div>

      <!-- Grid -->
      <div class="figma-grid" id="figmaGrid"></div>
    </div>

    <div class="figma-footer">
      <button class="btn-secondary" id="figmaCancelBtn">Cancel</button>
      <button class="figma-add-library-btn" id="figmaAddToLibraryBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14"/><path d="M5 12h14"/>
        </svg>
        Add to Library
      </button>
      <button class="figma-import-btn" id="figmaImportBtn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Import Selected (<span id="figmaSelCount">0</span>)
      </button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="figmaLibraryNamesModal">
  <div class="modal-overlay-bg"></div>
  <div class="modal figma-library-names-modal">
    <div class="modal-header">
      <h3>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14"/><path d="M5 12h14"/>
        </svg>
        Add to Library
      </h3>
      <button class="modal-close" id="figmaLibraryNamesCloseBtn">&times;</button>
    </div>
    <div class="modal-body">
      <p class="figma-library-names-note">Set names for selected icons before adding them to Library.</p>
      <div class="figma-library-names-list" id="figmaLibraryNamesList"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="figmaLibraryNamesCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="figmaLibraryNamesConfirmBtn">Add to Library</button>
    </div>
  </div>
</div>
