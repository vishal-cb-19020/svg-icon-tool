<div class="panel">
  <div class="panel-header">
    <h3 class="panel-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Upload Icons
      <span class="panel-chevron"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
    </h3>
  </div>
  <div class="panel-body">
    <div class="upload-box upload-box-main" id="svgDropZone">
      <div class="upload-icon upload-icon-lg">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-label">Drop SVG files here or click to browse</p>
      <p class="upload-hint">Supports multiple files &middot; .svg format only</p>
      <div class="upload-features">
        <span class="upload-feature"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Individual SVG icons</span>
        <span class="upload-feature"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Auto-detects fill &amp; stroke</span>
        <span class="upload-feature"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Drag &amp; drop multiple files</span>
      </div>
      <input type="file" accept=".svg,image/svg+xml" multiple class="file-input">
    </div>
  </div>
</div>
