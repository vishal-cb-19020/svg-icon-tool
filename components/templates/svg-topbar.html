<div class="topbar">
  <button class="topbar-hamburger" id="sidebarToggle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="topbar-title">
    <h2 id="pageTitle">Create Sprite</h2>
    <span class="topbar-breadcrumb">Workflow &rsaquo; <span id="pageBreadcrumb">Create Sprite</span></span>
  </div>
  <div class="topbar-actions">
    <div class="topbar-auth hidden" id="authControls">
      <span class="topbar-auth-status" id="authStatusPill">Auth required</span>
      <button class="btn btn-ghost topbar-auth-btn" id="authLoginBtn" type="button">Sign in with Zoho</button>
      <div class="topbar-user hidden" id="authUserBox">
        <img class="topbar-user-avatar hidden" id="authUserAvatar" alt="User avatar">
        <div class="topbar-user-meta">
          <span class="topbar-user-name" id="authUserName">Zoho User</span>
          <span class="topbar-user-email" id="authUserEmail"></span>
        </div>
        <button class="btn btn-ghost topbar-auth-btn" id="authLogoutBtn" type="button">Logout</button>
      </div>
    </div>
    <button class="btn btn-primary btn-generate" id="generateBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
        <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 3 0 3 0"/>
        <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-3 0-3"/>
      </svg>
      Generate
    </button>
  </div>
</div>
